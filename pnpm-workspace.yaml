packages:
  - apps/*
  - packages/*
  - tooling/*

# 1.3 — one version of React, React Native and react-native-web (and every other
# shared dependency) across the repo. Workspaces reference these as "catalog:".
# `pnpm deps:check` (syncpack) fails CI if anything drifts from the catalog.
catalog:
  # Expo SDK 57 — upgrade these together (15.1).
  expo: ~57.0.25
  expo-constants: ~57.0.19
  expo-linking: ~57.0.11
  expo-localization: ~57.0.2
  expo-notifications: ~57.0.21
  expo-router: ~57.0.23
  expo-secure-store: ~57.0.4
  expo-splash-screen: ~57.0.9
  expo-status-bar: ~57.0.1
  expo-system-ui: ~57.0.4
  expo-updates: ~57.0.23
  expo-web-browser: ~57.0.3
  expo-auth-session: ~57.0.13
  expo-background-task: ~57.0.20
  expo-task-manager: ~57.0.20
  expo-image: ~57.0.5
  expo-screen-capture: ~57.0.3
  expo-tracking-transparency: ~57.0.2
  expo-local-authentication: ~57.0.3
  '@expo/metro-runtime': ~57.0.16
  '@react-native-community/netinfo': 12.0.1
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-web: ~0.21.0
  react-native-gesture-handler: ~2.32.0
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  react-native-screens: ~4.26.0
  react-native-safe-area-context: ~5.7.0
  react-native-mmkv: ^4.3.2
  react-native-nitro-modules: ^0.37.1
  '@shopify/flash-list': 2.0.2
  '@types/react': ~19.2.0
  # Shared libraries
  '@tanstack/react-query': ^5.104.0
  zustand: ^5.0.15
  zod: ^4.6.5
  i18next: ^26.4.2
  react-i18next: ^17.0.15
  '@sentry/react-native': ~7.11.0
  '@sentry/react': ^10.0.0
  # Tooling
  typescript: ~5.9.3
  turbo: ^2.11.4
  syncpack: ^15.3.3
  prettier: ^3.6.0
  eslint: ^9.39.0
  typescript-eslint: ^8.46.0
  '@eslint/js': ^9.39.0
  eslint-plugin-react-hooks: ^7.0.0
  globals: ^16.0.0
  jest: ^29.7.0
  jest-expo: ~57.0.5
  '@types/jest': ^29.5.14
  babel-preset-expo: ~57.0.13
  '@testing-library/react-native': ^13.3.3
  '@testing-library/react': ^16.3.0
  '@testing-library/user-event': ^14.6.1
  '@testing-library/jest-dom': ^6.9.0
  react-test-renderer: 19.2.3
  msw: ^2.15.0
  '@playwright/test': ^1.63.0
  '@axe-core/playwright': ^4.11.0
  serve: ^14.2.5
  reassure: ^1.4.0
  '@types/node': ^22.18.0
  storybook: ^10.6.0
  web-vitals: ^5.3.0
  '@lhci/cli': ^0.15.0
  '@storybook/react-native-web-vite': ^10.6.0
  '@storybook/addon-a11y': ^10.6.0
  vite: ^7.0.0

# 1.3 — hard guarantee that transitive dependencies can't pull in a second React / RN.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  react-test-renderer: 19.2.3
  react-native: 0.86.3
  # Peers that Expo SDK 57 pins; auto-installed peers must not float past them.
  '@react-native/metro-config': 0.86.3
  react-native-worklets: 0.10.1
  react-native-reanimated: 4.5.1
  react-native-gesture-handler: ~2.32.0
  react-native-screens: ~4.26.0
  react-native-safe-area-context: ~5.7.0

peerDependencyRules:
  # Only needed by navigators this template doesn't use (drawer); mobile installs them itself.
  ignoreMissing:
    - react-native-gesture-handler
    - react-native-reanimated

onlyBuiltDependencies:
  - msw
  - esbuild
