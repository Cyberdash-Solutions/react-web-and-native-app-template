# 13.22 — the full suite nightly (not just affected), including contract suites for every
# still-supported mobile version (13.14) and a vulnerability audit (15.2).
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec tsc -b
      - run: pnpm turbo run typecheck lint --force
      - run: pnpm turbo run test --force -- --coverage --ci
        env:
          CI: true
          CONTRACT_API_URL: ${{ vars.CONTRACT_API_URL }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level high

  # 15.3 — the package graph, as an artifact for review; turbo fails on real cycles.
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm graph
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: dependency-graph.html
