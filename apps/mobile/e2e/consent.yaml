appId: com.example.helloworld.test
name: Consent gating (13.17 / 14.1)
tags: [critical]
env:
  APP_ID: com.example.helloworld.test
  API_URL: http://localhost:4000
---
- runFlow: ../../../tooling/maestro/subflows/launch.yaml
- assertVisible: 'We value your privacy'
- runFlow:
    file: ../../../tooling/maestro/subflows/consent.yaml
    env:
      ANSWER: Decline
# The decision survives a restart (persisted in MMKV).
- stopApp
- launchApp
- assertVisible: 'Hello, world!'
- assertNotVisible: 'We value your privacy'
