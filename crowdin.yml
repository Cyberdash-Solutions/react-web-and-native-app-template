# 10.2 — Translation workflow. English (packages/i18n/src/locales/en.json) is the source; Crowdin
# (or Lokalise — see its CLI equivalent) opens PRs with the other locales. `pnpm i18n:check`
# fails CI on missing or stale keys in any locale.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true
files:
  - source: /packages/i18n/src/locales/en.json
    translation: /packages/i18n/src/locales/%two_letters_code%.json
